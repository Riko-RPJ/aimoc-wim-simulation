<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIMOC WIM API and ERP</title><link rel="stylesheet" href="style.css"><style>body{overflow-x:hidden}article{max-width:1000px;margin:24px auto;padding:20px;line-height:1.6}article h1,article h2{line-height:1.2}nav{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px}table{width:100%;border-collapse:collapse;margin:16px 0}th,td{text-align:left;padding:12px;border:1px solid #355064;vertical-align:top}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#0c1b28;border:1px solid #355064;border-radius:8px;font-size:13px}code{overflow-wrap:anywhere}details{margin:24px 0}summary{cursor:pointer}@media(max-width:700px){article{padding:12px}table{display:block;overflow-x:auto}header{gap:12px}}</style></head><body><header><strong>AIMOC WIM · API / ERP</strong><select id="language" aria-label="Language / Bahasa"><option value="id">IND</option><option value="en">EN</option></select></header><article><nav><a id="home" href="/parallel.html?phase=1"></a><a id="phase1" href="/parallel.html?phase=1"></a><a id="phase2" href="/parallel.html?phase=2"></a></nav><main id="docs"></main></article><script>const copy={"id": {"title": "API dan integrasi ERP", "home": "Kembali ke demo", "phase1": "Phase 1 satu statis bersama", "phase2": "Phase 2 statis dan WIM", "content": "<h1>API dan integrasi ERP</h1>\n<p>Demo ini menggunakan data sintetis. API phase 1 dan phase 2 memvalidasi kontrak dan menghitung ulang angka; tidak mengirim ke Oracle NetSuite dan tidak menyimpan transaksi permanen. <code>accepted=true</code> berarti validasi API berhasil, bukan pencatatan ERP.</p>\n<h2>Dua phase implementasi</h2>\n<table><thead><tr><th>Phase</th><th>Sumber timbang</th><th>Endpoint</th><th>Schema</th></tr></thead><tbody>\n<tr><td>1</td><td>Satu jembatan timbang statis dipakai bergantian untuk tare masuk dan gross keluar</td><td><code>POST /api/single-static-measurements</code></td><td>4.0</td></tr>\n<tr><td>2</td><td>Statis untuk tare masuk dan WIM pada lajur terpisah untuk gross keluar</td><td><code>POST /api/parallel-measurements</code></td><td>2.1</td></tr></tbody></table>\n<h2>Phase 1 satu resource fisik</h2>\n<p>Kirim JSON lengkap dari tombol Unduh JSON setelah trip selesai. Payload wajib berisi <code>schema_version=4.0</code>, <code>phase=phase1</code>, <code>scenario=single_static_inbound_outbound</code>, <code>synthetic=true</code>, <code>complete=true</code> dan <code>weight_valid=true</code>.</p>\n<ul><li>Tare dan gross berasal dari <code>STATIC-01</code> dan indikator yang sama <code>STATIC-IND-01</code>. Kedua pembacaan harus stabil, berdivisi 20 kg dan dalam kapasitas 80.000 kg; gross terukur tidak boleh lebih kecil dari tare.</li>\n<li>Layout berisi satu stasiun statis bersama tanpa WIM. <code>scale_measurements</code> berisi tare masuk dan gross keluar untuk trip yang sama. Resource harus sudah dilepas setelah kendaraan keluar.</li>\n<li>QR masuk dan keluar harus ditutup pada trip/order yang sama, dengan urutan riwayat scan dan reservasi resource yang konsisten. Riwayat interlock adalah urutan sintetis, bukan bukti safety PLC atau pengamatan fisik.</li></ul>\n<pre>{\"schema_version\":\"4.0\",\"phase\":\"phase1\",\"scenario\":\"single_static_inbound_outbound\",\"source\":{\"tare\":\"shared_static_indicator_via_iot_gateway\",\"gross\":\"shared_static_indicator_via_iot_gateway\",\"resource_id\":\"STATIC-01\",\"indicator_id\":\"STATIC-IND-01\"}}</pre>\n<p class=\"caption\">Cuplikan di atas hanya identitas kontrak. Gunakan JSON unduhan lengkap, termasuk measurement, erp, layout, static_construction, scale_measurements, shared_scale dan resource_history, untuk POST.</p>\n<h2>Hasil hitung dan status</h2>\n<p>Contoh: tare 23.100 kg, gross 71.100 kg dan berat jenis 1,5 ton/m³ menghasilkan muatan 48 ton dan volume ekuivalen 32 m³. API menghitung net = gross − tare dan volume = net ÷ (1.000 × berat jenis). Volume bukan hasil LiDAR. Selisih order hanya angka; keputusan komersial tetap milik ERP.</p>\n<pre>{\"accepted\":true,\"persisted\":false,\"forwarded_to_erp\":false,\"mode\":\"validate_only\",\"delivery\":{\"status\":\"not_configured\"}}</pre>\n<p>HTTP 400 menolak input tidak valid; 405 menolak metode tidak didukung. Idempotency key adalah referensi trip, tanpa deduplikasi permanen. Simulasi offline menggambarkan record lokal; belum membuktikan penyimpanan tahan restart, retry queue atau sinkronisasi ERP nyata.</p>\n<h2>Status dan schema</h2><p><code>GET /api/health</code> menampilkan status API dan konfigurasi ERP. <code>GET /api/schema</code> mencantumkan endpoint phase. GET pada kedua endpoint phase menampilkan metadata mode validate_only. Tidak ada endpoint riwayat transaksi permanen.</p>\n<h2>Batas integrasi nyata</h2><p>Integrasi proyek memerlukan protokol indikator/controller, gateway terautentikasi, database dan audit trail, buffer persisten, deduplikasi, pemetaan field ERP, business ACK, rekonsiliasi serta UAT. Dua endpoint phase tetap validate-only walaupun environment forwarding endpoint lama diatur.</p>\n<details><summary>Endpoint lama dan konfigurasi opsional</summary><p><code>POST /api/measurements</code> adalah kontrak simulasi WIM + WIM schema 1.0; hanya endpoint lama ini memiliki opsi forwarding server. <code>POST /api/hybrid-measurements</code> schema 2.0 dan <code>POST /api/static-measurements</code> schema 3.0 tetap validate-only. Opsi tiga model ini berbeda dari dua phase implementasi terbaru.</p><pre>ERP_FORWARDING_ENABLED=true\nERP_WEBHOOK_URL=https://erp.example/api/wim\nERP_AUTH_TYPE=bearer # atau x-api-key\nERP_API_KEY=(server secret)\nERP_WEBHOOK_SECRET=(optional HMAC secret)\nERP_FIELD_MAP={\"reference\":\"trip_id\",\"tonnage\":\"measurement.net_cargo_tonnes\",\"volume\":\"measurement.volume_m3\"}\nCORS_ALLOWED_ORIGINS=https://erp.example</pre><p>Secret hanya di server. URL ERP wajib HTTPS. HTTP 2xx adalah penerimaan transport, bukan ACK bisnis. Receiver harus melakukan deduplikasi atas trip ID; belum ada retry queue permanen pada endpoint lama. Tanpa konfigurasi, delivery.status=not_configured.</p></details>"}, "en": {"title": "API and ERP integration", "home": "Back to demo", "phase1": "Phase 1 one shared static scale", "phase2": "Phase 2 static and WIM", "content": "<h1>API and ERP integration</h1>\n<p>This demo uses synthetic data. Phase 1 and Phase 2 APIs validate the contract and recompute totals; they do not forward to Oracle NetSuite or permanently store transactions. <code>accepted=true</code> means API validation succeeded, not ERP posting.</p>\n<h2>Two implementation phases</h2>\n<table><thead><tr><th>Phase</th><th>Weighing source</th><th>Endpoint</th><th>Schema</th></tr></thead><tbody>\n<tr><td>1</td><td>One static weighbridge serves inbound tare and outbound gross sequentially</td><td><code>POST /api/single-static-measurements</code></td><td>4.0</td></tr>\n<tr><td>2</td><td>Inbound static tare and outbound WIM gross in separate lanes</td><td><code>POST /api/parallel-measurements</code></td><td>2.1</td></tr></tbody></table>\n<h2>Phase 1 one physical resource</h2>\n<p>POST the complete JSON downloaded after a completed trip. Required fields include <code>schema_version=4.0</code>, <code>phase=phase1</code>, <code>scenario=single_static_inbound_outbound</code>, <code>synthetic=true</code>, <code>complete=true</code> and <code>weight_valid=true</code>.</p>\n<ul><li>Both weights must come from <code>STATIC-01</code> and the same <code>STATIC-IND-01</code> indicator. Readings must be stable, on 20 kg divisions and within the 80,000 kg instrument capacity; measured gross must not be below tare.</li>\n<li>The layout has one shared static station and no WIM. <code>scale_measurements</code> contains inbound tare and outbound gross for the same trip. The resource must have been released after departure.</li>\n<li>Entry and exit QR scans must close on the same trip/order with consistent scan and resource reservation histories. The interlock history is synthetic, not proof of a safety PLC or physical observations.</li></ul>\n<pre>{\"schema_version\":\"4.0\",\"phase\":\"phase1\",\"scenario\":\"single_static_inbound_outbound\",\"source\":{\"tare\":\"shared_static_indicator_via_iot_gateway\",\"gross\":\"shared_static_indicator_via_iot_gateway\",\"resource_id\":\"STATIC-01\",\"indicator_id\":\"STATIC-IND-01\"}}</pre>\n<p class=\"caption\">The snippet identifies the contract only. POST the full downloaded JSON, including measurement, erp, layout, static_construction, scale_measurements, shared_scale and resource_history.</p>\n<h2>Computed totals and status</h2>\n<p>Example: 23,100 kg tare, 71,100 kg gross and 1.5 tonnes/m³ density produce 48 tonnes net cargo and 32 m³ equivalent volume. The API recomputes net = gross − tare and volume = net ÷ (1,000 × density). Volume is not a LiDAR measurement. Order differences are numerical only; commercial decisions remain with ERP.</p>\n<pre>{\"accepted\":true,\"persisted\":false,\"forwarded_to_erp\":false,\"mode\":\"validate_only\",\"delivery\":{\"status\":\"not_configured\"}}</pre>\n<p>HTTP 400 rejects invalid input; 405 rejects unsupported methods. The idempotency key is a trip reference, without durable deduplication. Offline mode illustrates a local record; it does not prove restart-safe persistence, a retry queue or real ERP synchronization.</p>\n<h2>Status and schema</h2><p><code>GET /api/health</code> reports API and ERP configuration status. <code>GET /api/schema</code> lists phase endpoints. GET on either phase endpoint returns validate_only metadata. There is no permanent transaction history endpoint.</p>\n<h2>Real integration requirements</h2><p>Implementation needs indicator/controller protocols, an authenticated gateway, a database and audit trail, durable buffering, deduplication, ERP field mapping, business ACK, reconciliation and UAT. Both phase endpoints remain validate-only even if the legacy endpoint forwarding environment is configured.</p>\n<details><summary>Legacy endpoints and optional configuration</summary><p><code>POST /api/measurements</code> is the WIM + WIM synthetic contract, schema 1.0; only this legacy endpoint has optional server forwarding. <code>POST /api/hybrid-measurements</code> schema 2.0 and <code>POST /api/static-measurements</code> schema 3.0 remain validate-only. These three model options differ from the latest two implementation phases.</p><pre>ERP_FORWARDING_ENABLED=true\nERP_WEBHOOK_URL=https://erp.example/api/wim\nERP_AUTH_TYPE=bearer # or x-api-key\nERP_API_KEY=(server secret)\nERP_WEBHOOK_SECRET=(optional HMAC secret)\nERP_FIELD_MAP={\"reference\":\"trip_id\",\"tonnage\":\"measurement.net_cargo_tonnes\",\"volume\":\"measurement.volume_m3\"}\nCORS_ALLOWED_ORIGINS=https://erp.example</pre><p>Secrets remain on the server. ERP URLs must use HTTPS. HTTP 2xx means transport acceptance, not business ACK. The receiver must deduplicate trip IDs; the legacy endpoint has no persistent retry queue. Without configuration, delivery.status=not_configured.</p></details>"}};
let language=localStorage.getItem('aimoc-language')==='en'?'en':'id';
function render(){const c=copy[language];document.documentElement.lang=language;document.title='AIMOC WIM · '+c.title;document.getElementById('language').value=language;for(const id of ['home','phase1','phase2'])document.getElementById(id).textContent=c[id];document.getElementById('docs').innerHTML=c.content;}
document.getElementById('language').onchange=e=>{language=e.target.value;localStorage.setItem('aimoc-language',language);render();};render();</script></body></html>
